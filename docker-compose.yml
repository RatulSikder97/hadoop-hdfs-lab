# Unified multi-PC Hadoop cluster (HDFS + YARN) driven by Compose profiles.
# Put this SAME file on every machine; pick the role with --profile:
#
#   Master PC (this one, 10.100.201.151):
#     MASTER_IP=10.100.201.151 docker compose --profile master up -d
#
#   Worker PC (run on each, with that PC's own LAN IP). On Docker Desktop give
#   every EXTRA worker a unique DN_XFER_PORT so the NameNode can tell them apart:
#     WORKER_IP=10.100.201.161                   docker compose --profile worker up -d
#     WORKER_IP=10.100.201.133 DN_XFER_PORT=19866 docker compose --profile worker up -d
#
# Shared HDFS/YARN settings live in ./hadoop.env (next to this file).
version: "3.8"

x-hadoop-env: &hadoop-env
  env_file: ./hadoop.env

services:
  # ---------------- MASTER PROFILE ----------------
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    hostname: namenode
    profiles: ["master"]
    restart: unless-stopped
    ports:
      - "9870:9870"   # NameNode web UI
      - "9000:9000"   # HDFS RPC (DataNodes + clients)
    volumes:
      - namenode_data:/hadoop/dfs/name
    <<: *hadoop-env
    environment:
      - CLUSTER_NAME=multi-pc-cluster

  resourcemanager:
    image: bde2020/hadoop-resourcemanager:2.0.0-hadoop3.2.1-java8
    container_name: resourcemanager
    hostname: resourcemanager
    profiles: ["master"]
    restart: unless-stopped
    ports:
      - "8088:8088"   # YARN web UI
      - "8032:8032"   # RM client RPC
      - "8030:8030"   # scheduler
      - "8031:8031"   # resource-tracker (remote NodeManagers register here)
      - "8033:8033"   # RM admin
    <<: *hadoop-env

  # ---------------- WORKER PROFILE ----------------
  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode
    hostname: datanode
    profiles: ["worker"]
    restart: unless-stopped
    ports:
      - "9864:9864"                                    # DataNode web UI
      - "${DN_XFER_PORT:-9866}:${DN_XFER_PORT:-9866}"  # block data transfer (UNIQUE per worker)
      - "9867:9867"                                    # DataNode IPC
    volumes:
      - datanode_data:/hadoop/dfs/data
    <<: *hadoop-env
    environment:
      # CRITICAL: advertise THIS PC's physical LAN IP, not the docker bridge IP.
      - HDFS_CONF_dfs_datanode_use_datanode_hostname=true
      - HDFS_CONF_dfs_datanode_hostname=${WORKER_IP}
      # On Docker Desktop EVERY container self-reports the same internal gateway
      # IP (192.168.65.1), so two workers would register the identical xfer
      # address and the NameNode would treat them as ONE node (they evict each
      # other). Give each worker a UNIQUE data-transfer port so its identity
      # (ip:port) stays distinct and both remain live. Worker 1 keeps the
      # default 9866; each extra worker sets DN_XFER_PORT (e.g. 19866).
      - HDFS_CONF_dfs_datanode_address=0.0.0.0:${DN_XFER_PORT:-9866}

  nodemanager:
    image: bde2020/hadoop-nodemanager:2.0.0-hadoop3.2.1-java8
    container_name: nodemanager
    hostname: nodemanager
    profiles: ["worker"]
    restart: unless-stopped
    ports:
      - "8042:8042"     # NodeManager web UI
      - "8041:8041"     # container-management RPC — RM connects HERE to launch the AppMaster
      - "8040:8040"     # localizer
      - "13562:13562"   # MapReduce shuffle (reducers fetch map output)
    <<: *hadoop-env
    environment:
      - YARN_CONF_yarn_nodemanager_hostname=${WORKER_IP}
      # Pin NM RPC ports to fixed, PUBLISHED values (defaults are random ports
      # Docker never exposes -> RM "Connection refused" launching the AM -> job
      # stuck ACCEPTED). bind-host=0.0.0.0 binds all interfaces inside the
      # container; 'address' is the ADVERTISED identity and MUST carry
      # ${WORKER_IP} (0.0.0.0 there makes the NM advertise its container
      # hostname 'nodemanager', so both workers collide as one node).
      - YARN_CONF_yarn_nodemanager_bind___host=0.0.0.0
      - YARN_CONF_yarn_nodemanager_address=${WORKER_IP}:8041
      - YARN_CONF_yarn_nodemanager_localizer_address=0.0.0.0:8040
      - MAPRED_CONF_mapreduce_shuffle_port=13562

volumes:
  namenode_data:
  datanode_data:
