version: "3"

services:
  namenode:
    build: ./namenode
    container_name: namenode
    platform: linux/amd64
    ports:
      - "9870:9870"
      - "9000:9000"
    environment:
      CLUSTER_NAME: test
    env_file:
      - ./hadoop.env

  datanode:
    build: ./datanode
    platform: linux/amd64
    # container_name: datanode
    depends_on:
      - namenode
    env_file:
      - ./hadoop.env

  resourcemanager:
    image: bde2020/hadoop-resourcemanager:2.0.0-hadoop3.2.1-java8
    container_name: resourcemanager
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "8088:8088"
    depends_on:
      - namenode
      - datanode
    env_file:
      - ./hadoop.env
    environment:
      # JVM safepoint crash workaround for OpenJDK 8 running under qemu
      # user-mode emulation (amd64-on-arm64 Apple Silicon).
      # Disable biased locking + force SerialGC to avoid the
      # 'guarantee(PageArmed == 0) failed: invariant' abort.
      YARN_RESOURCEMANAGER_OPTS: "-XX:-UseBiasedLocking -XX:+UseSerialGC -XX:-UsePerfData"
      HADOOP_OPTS: "-XX:-UseBiasedLocking -XX:+UseSerialGC -XX:-UsePerfData"
