# Cluster using the OFFICIAL Apache Hadoop images (3.4.1), as an alternative to
# the bde2020 cluster in the parent folder. Each role is selected via `command`,
# config comes from ./config, and a real NodeManager is included so YARN runs
# actual containers (not just local mode).
#
#   Run from this folder:
#     Start:  docker compose up -d
#     Stop:   docker compose down
#
# Note: the apache/hadoop image may not ship python3 — if you run the Streaming
# job here, install it first, and the streaming jar is at
# /opt/hadoop/share/hadoop/tools/lib/hadoop-streaming-3.4.1.jar
services:
  namenode:
    image: apache/hadoop:3.4.1
    hostname: namenode
    container_name: namenode
    command: ["hdfs", "namenode"]
    ports:
      - "9870:9870"   # NameNode web UI
      - "8020:8020"   # HDFS RPC
    env_file:
      - ./config
    environment:
      ENSURE_NAMENODE_DIR: "/tmp/hadoop-root/dfs/name"

  datanode:
    image: apache/hadoop:3.4.1
    container_name: datanode
    command: ["hdfs", "datanode"]
    depends_on:
      - namenode
    env_file:
      - ./config

  resourcemanager:
    image: apache/hadoop:3.4.1
    hostname: resourcemanager
    container_name: resourcemanager
    command: ["yarn", "resourcemanager"]
    ports:
      - "8088:8088"   # YARN web UI
    depends_on:
      - namenode
      - datanode
    env_file:
      - ./config

  nodemanager:
    image: apache/hadoop:3.4.1
    container_name: nodemanager
    command: ["yarn", "nodemanager"]
    depends_on:
      - resourcemanager
    env_file:
      - ./config
