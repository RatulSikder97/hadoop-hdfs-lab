# Generated by cluster-setup.sh — runs on the NameNode host (10.100.201.155).
#   docker compose -f docker-compose.namenode.yml up -d
services:
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    hostname: namenode
    restart: unless-stopped
    ports:
      - "9000:9000"   # HDFS RPC (DataNodes + clients connect here)
      - "9870:9870"   # NameNode web UI -> http://10.100.201.155:9870
    volumes:
      - namenode_data:/hadoop/dfs/name
    environment:
      CLUSTER_NAME: test
      HDFS_NAMENODE_OPTS: "-XX:-UseBiasedLocking -XX:+UseSerialGC -XX:-UsePerfData"
      HADOOP_OPTS: "-XX:-UseBiasedLocking -XX:+UseSerialGC -XX:-UsePerfData"
    env_file:
      - ./hadoop.env

volumes:
  namenode_data:
