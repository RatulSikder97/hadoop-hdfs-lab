# Runs on THIS PC (10.100.200.101).
#   docker compose -f docker-compose.namenode.yml up -d
services:
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    hostname: namenode
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "9000:9000"   # HDFS RPC  (DataNode + clients connect here)
      - "9870:9870"   # NameNode web UI -> http://10.100.200.101:9870
    volumes:
      - namenode_data:/hadoop/dfs/name
    environment:
      CLUSTER_NAME: test
      # Stability workaround for OpenJDK8 running under qemu (amd64-on-arm64)
      HDFS_NAMENODE_OPTS: "-XX:-UseBiasedLocking -XX:+UseSerialGC -XX:-UsePerfData"
      HADOOP_OPTS: "-XX:-UseBiasedLocking -XX:+UseSerialGC -XX:-UsePerfData"
    env_file:
      - ./hadoop.env

volumes:
  namenode_data:
