# Standalone WORKER compose — run on each worker PC (PC-B, PC-C).
#   WORKER_IP=<this PC's LAN IP>                     docker compose -f docker-compose.worker.yml up -d
#   WORKER_IP=<this PC's LAN IP> DN_XFER_PORT=19866  docker compose -f docker-compose.worker.yml up -d
#
# Give EACH extra worker a UNIQUE DN_XFER_PORT: Docker Desktop reports the same
# internal IP (192.168.65.1) on every PC, so DataNodes need distinct ports to
# avoid colliding. Shared HDFS/YARN settings live in ./hadoop.env (next to this).

x-hadoop-env: &hadoop-env
  env_file: ./hadoop.env

services:
  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode
    hostname: datanode
    restart: unless-stopped
    ports:
      - "9864:9864"                                    # DataNode web UI
      - "${DN_XFER_PORT:-9866}:${DN_XFER_PORT:-9866}"  # block data transfer (UNIQUE per worker)
      - "9867:9867"                                    # DataNode IPC
    volumes:
      - datanode_data:/hadoop/dfs/data
    <<: *hadoop-env
    environment:
      # CRITICAL: advertise THIS PC's physical LAN IP, not the docker bridge IP.
      - HDFS_CONF_dfs_datanode_use_datanode_hostname=true
      - HDFS_CONF_dfs_datanode_hostname=${WORKER_IP:?set WORKER_IP to this PC's LAN IP}
      # Unique data-transfer port so two workers don't register as the same node.
      - HDFS_CONF_dfs_datanode_address=0.0.0.0:${DN_XFER_PORT:-9866}

  nodemanager:
    image: bde2020/hadoop-nodemanager:2.0.0-hadoop3.2.1-java8
    container_name: nodemanager
    hostname: nodemanager
    restart: unless-stopped
    ports:
      - "8042:8042"     # NodeManager web UI
      - "8041:8041"     # container-management RPC — RM connects HERE to launch the AppMaster
      - "8040:8040"     # localizer
      - "13562:13562"   # MapReduce shuffle (reducers fetch map output)
    <<: *hadoop-env
    environment:
      - YARN_CONF_yarn_nodemanager_hostname=${WORKER_IP:?set WORKER_IP to this PC's LAN IP}
      # Pin NM RPC ports to fixed, PUBLISHED values (defaults are random ports
      # Docker never exposes -> RM "Connection refused" launching the AM -> job
      # stuck ACCEPTED). bind-host=0.0.0.0 binds all interfaces INSIDE the
      # container, while 'address' is the ADVERTISED identity. It MUST carry
      # ${WORKER_IP}; if you bind 0.0.0.0 in 'address' the NM advertises its
      # container hostname ('nodemanager') and both workers collide as one node.
      - YARN_CONF_yarn_nodemanager_bind___host=0.0.0.0
      - YARN_CONF_yarn_nodemanager_address=${WORKER_IP}:8041
      - YARN_CONF_yarn_nodemanager_localizer_address=0.0.0.0:8040
      - MAPRED_CONF_mapreduce_shuffle_port=13562
      # Enable the shuffle aux-service (the image ships the .class but not the
      # list, so MR task containers fail with "auxService:mapreduce_shuffle
      # does not exist"). Value keeps its underscore (env->xml mangles keys, not values).
      - YARN_CONF_yarn_nodemanager_aux___services=mapreduce_shuffle

volumes:
  datanode_data:
