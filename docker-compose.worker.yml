# Worker node (DataNode + NodeManager) for the multi-PC Hadoop cluster.
# Copy this file + hadoop.env to EACH worker PC, then start it with that
# machine's OWN LAN IP in WORKER_IP:
#
#   On 10.100.202.31:
#     WORKER_IP=10.100.202.31 docker compose -f docker-compose.worker.yml up -d
#   On 10.100.202.49:
#     WORKER_IP=10.100.202.49 docker compose -f docker-compose.worker.yml up -d
#
# The NameNode/ResourceManager (Master) location comes from ./hadoop.env
# (CORE_CONF_fs_defaultFS + YARN_CONF_yarn_resourcemanager_hostname -> 10.100.201.155).

x-hadoop-env: &hadoop-env
  env_file: ./hadoop.env

services:
  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode
    hostname: datanode
    restart: unless-stopped
    ports:
      - "9864:9864"   # DataNode web UI
      - "9866:9866"   # block data transfer
      - "9867:9867"   # DataNode IPC
    volumes:
      - datanode_data:/hadoop/dfs/data
    <<: *hadoop-env
    environment:
      # CRITICAL: advertise THIS PC's physical LAN IP, not the docker bridge IP.
      - HDFS_CONF_dfs_datanode_use_datanode_hostname=true
      - HDFS_CONF_dfs_datanode_hostname=${WORKER_IP:?set WORKER_IP to this PC's LAN IP}

  nodemanager:
    image: bde2020/hadoop-nodemanager:2.0.0-hadoop3.2.1-java8
    container_name: nodemanager
    hostname: nodemanager
    restart: unless-stopped
    ports:
      - "8042:8042"   # NodeManager web UI
    <<: *hadoop-env
    environment:
      - YARN_CONF_yarn_nodemanager_hostname=${WORKER_IP:?set WORKER_IP to this PC's LAN IP}

volumes:
  datanode_data:
